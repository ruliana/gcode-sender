name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Check the web UI
        run: |
          node --check web/app.js
          node --check web/lib.js
          node --check web/preview.js
          node --test web/lib.test.js

  # Merges a pull request into main once every test job above has passed.
  # The branch is deleted by the merge. Add new test jobs to `needs`.
  auto-merge:
    needs: [test]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the pull request and delete its branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only merge the commit that passed the tests, never a newer push.
          gh pr merge "$PR_URL" --merge --delete-branch --match-head-commit "$HEAD_SHA"
