[package]
name = "gcode-sender-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Fuzzing is its own workspace, so the main build and CI tests never pick it up.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
gcode-sender = { path = "../crates/gcode-sender" }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "gcode_program"
path = "fuzz_targets/gcode_program.rs"
test = false
doc = false
bench = false

[[bin]]
name = "grbl_reply"
path = "fuzz_targets/grbl_reply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_documents"
path = "fuzz_targets/json_documents.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stored_jobs"
path = "fuzz_targets/stored_jobs.rs"
test = false
doc = false
bench = false
